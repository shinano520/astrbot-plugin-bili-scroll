<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刷B站</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --line:#272b34; --line2:#333a46;
    --text:#e6e8ee; --sub:#9aa3b2; --accent:#4f8cff;
    --ok:#3ecf8e; --warn:#f5a623; --err:#ff5c5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
  body{
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:18px;
  }
  .wrap{max-width:960px;margin:0 auto}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap}
  .tab{
    padding:8px 16px;border-radius:9px;border:1px solid transparent;background:transparent;
    color:var(--sub);font-size:13.5px;cursor:pointer;transition:.15s;
  }
  .tab:hover{background:#181b22;color:var(--text)}
  .tab.active{background:#22262f;border-color:var(--line2);color:var(--text);font-weight:600}

  .panel{display:none}
  .panel.active{display:block}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:15px;font-weight:600}
  .card .desc{color:var(--sub);font-size:12.5px;margin-bottom:14px}

  .row{display:flex;gap:18px;flex-wrap:wrap}
  .col{flex:1;min-width:260px}

  .state{display:flex;align-items:center;gap:9px;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--sub);flex:none}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
  .dot.pulse{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  button{
    padding:9px 16px;border-radius:9px;border:1px solid var(--line2);
    background:#22262f;color:var(--text);font-size:13px;cursor:pointer;transition:.15s;
  }
  button:hover:not(:disabled){background:#2a2f3a}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:#3d7aec}
  button:disabled{opacity:.45;cursor:not-allowed}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

  .qrbox{
    display:flex;align-items:center;justify-content:center;
    width:250px;height:250px;background:#fff;border-radius:12px;padding:14px;
  }
  .qrbox img{width:220px;height:220px;image-rendering:pixelated;display:block}
  .placeholder{color:#888;font-size:12.5px;text-align:center;padding:20px}

  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
  .meta div{background:#14171d;border:1px solid var(--line);border-radius:10px;padding:11px}
  .meta .k{color:var(--sub);font-size:11.5px;margin-bottom:3px}
  .meta .v{font-size:16px;font-weight:600}

  .list{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
  .item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
  .item:last-child{border-bottom:none}
  .item:hover{background:#14171d}
  .item input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  .tag{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--sub)}
  .tag.mutual{color:var(--ok);border-color:rgba(62,207,142,.4)}

  .tip{margin-top:12px;font-size:12px;color:var(--sub);line-height:1.7}
  .tip b{color:var(--warn)}
  .result{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:12.5px;display:none}
  .result.ok{display:block;background:rgba(62,207,142,.12);color:var(--ok);border:1px solid rgba(62,207,142,.3)}
  .result.err{display:block;background:rgba(255,92,92,.12);color:var(--err);border:1px solid rgba(255,92,92,.3)}

  /* 设置表单 */
  .group{margin-bottom:22px}
  .group-title{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .field{display:flex;gap:14px;padding:9px 0;align-items:flex-start;border-bottom:1px solid rgba(39,43,52,.6)}
  .field:last-child{border-bottom:none}
  .field .label{flex:0 0 42%;min-width:0}
  .field .label .n{font-size:13px;margin-bottom:2px}
  .field .label .h{font-size:11.5px;color:var(--sub);line-height:1.5}
  .field .ctrl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);
    background:#14171d;color:var(--text);font:13px/1.5 inherit;
  }
  .field textarea{min-height:70px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
  .switch{display:flex;align-items:center;gap:8px}
  .switch input{width:38px;height:20px;appearance:none;background:#333a46;border-radius:10px;position:relative;cursor:pointer;transition:.2s;flex:none}
  .switch input:checked{background:var(--accent)}
  .switch input::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
  .switch input:checked::after{left:20px}
  .sticky-bar{
    position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
    padding:16px 0 4px;display:flex;gap:10px;justify-content:flex-end;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="tabs">
    <button class="tab active" data-panel="login">登录</button>
    <button class="tab" data-panel="settings">设置</button>
    <button class="tab" data-panel="atusers">评论 @ 谁</button>
  </div>

  <!-- 登录 -->
  <div class="panel active" id="panel-login">
    <div class="card">
      <h2>B 站账号</h2>
      <div class="desc">没登录就没法搜索、读字幕、发评论</div>
      <div class="row">
        <div class="col">
          <div class="state"><span class="dot" id="dot"></span><span id="loginText">检查中…</span></div>
          <div class="meta" id="metaBox" style="display:none">
            <div><div class="k">昵称</div><div class="v" id="mName">-</div></div>
            <div><div class="k">UID</div><div class="v" id="mUid">-</div></div>
            <div><div class="k">今日已挑</div><div class="v" id="mQuota">-</div></div>
          </div>
          <div class="actions">
            <button class="primary" id="btnGen">扫码登录</button>
            <button id="btnRefresh">刷新状态</button>
          </div>
          <div class="result" id="result"></div>
        </div>
        <div class="col" style="flex:none">
          <div class="qrbox" id="qrbox"><div class="placeholder">点「扫码登录」生成二维码</div></div>
        </div>
      </div>
      <div class="tip">手机 B 站扫码后，确认时选 <b>「记住我 / 长期」</b>。选 24 小时的话明天就得重扫。</div>
    </div>
  </div>

  <!-- 设置 -->
  <div class="panel" id="panel-settings">
    <div class="card">
      <h2>插件设置</h2>
      <div class="desc">改完点最下面的「保存设置」。改完立即生效，不用重启。</div>
      <div id="settingsBox"><div class="placeholder">加载中…</div></div>
      <div class="sticky-bar">
        <button id="btnReload">重新加载</button>
        <button class="primary" id="btnSaveCfg">保存设置</button>
      </div>
      <div class="result" id="cfgResult"></div>
    </div>
  </div>

  <!-- @ 用户 -->
  <div class="panel" id="panel-atusers">
    <div class="card">
      <h2>评论时 @ 谁</h2>
      <div class="desc">从互关列表里选。勾了才会在评论末尾 @ 对方（按概率触发）</div>
      <div class="actions" style="margin-top:0;margin-bottom:8px">
        <button id="btnFollow">拉取互关列表</button>
        <button class="primary" id="btnSaveAt">保存选择</button>
        <span class="state" style="margin-left:auto"><span id="atCount">已选 0 人</span></span>
      </div>
      <div class="list" id="followList"><div class="placeholder">还没拉取。点上面的按钮。</div></div>
    </div>
  </div>

</div>

<script>
(function(){
  var API = window.AstrBotPluginView || window.AstrBotPluginPage;
  var ROOT = '/astrbot_plugin_bili_scroll';

  function ready(){
    return API && API.ready ? API.ready() : Promise.resolve();
  }

  function get(path, params){
    if (!API || !API.apiGet) return Promise.reject(new Error('bridge 不可用'));
    return API.apiGet(ROOT + path, params || {});
  }

  function post(path, body){
    if (!API || !API.apiPost) return Promise.reject(new Error('bridge 不可用'));
    return API.apiPost(ROOT + path, body || {});
  }

  // ── Tab 切换 ─────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.getAttribute('data-panel')).classList.add('active');
      if (btn.getAttribute('data-panel') === 'settings' && !window.__cfgLoaded) loadConfig();
    });
  });

  // ── 登录 ─────────────────────────────────────────────────
  var dot = document.getElementById('dot');
  var loginText = document.getElementById('loginText');
  var metaBox = document.getElementById('metaBox');
  var qrbox = document.getElementById('qrbox');
  var result = document.getElementById('result');
  var currentKey = '', timer = null, busy = false;

  function setDot(cls, text){ dot.className = 'dot' + (cls ? ' ' + cls : ''); loginText.textContent = text; }
  function showResult(t, ok){ result.textContent = t; result.className = 'result ' + (ok ? 'ok' : 'err'); }
  function hideResult(){ result.className = 'result'; result.textContent = ''; }
  function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }

  function refreshStatus(){
    setDot('warn', '检查中…');
    ready().then(function(){ return get('/status'); }).then(function(d){
      if (!d || !d.ok) { setDot('err', '状态获取失败'); return; }
      if (d.logged_in) {
        setDot('ok', '已登录');
        metaBox.style.display = 'grid';
        document.getElementById('mName').textContent = d.name || '-';
        document.getElementById('mUid').textContent = d.uid || '-';
        document.getElementById('mQuota').textContent = (d.picked || 0) + '/' + (d.max_per_day || 0);
      } else {
        setDot('err', '未登录');
        metaBox.style.display = 'none';
      }
    }).catch(function(e){ setDot('err', '网络错误'); showResult(String(e && e.message || e), false); });
  }

  function genQr(){
    if (busy) return;
    busy = true; hideResult(); stopTimer();
    setDot('warn', '生成二维码…');
    qrbox.innerHTML = '<div class="placeholder">生成中…</div>';
    ready().then(function(){ return get('/qr'); }).then(function(d){
      if (!d || !d.ok) throw new Error((d && d.error) || '生成失败');
      currentKey = d.key;
      qrbox.innerHTML = '<img alt="二维码" src="data:image/png;base64,' + d.image + '">';
      setDot('warn', '等待扫码');
      dot.classList.add('pulse');
      stopTimer();
      timer = setInterval(pollOnce, 2500);
    }).catch(function(e){
      setDot('err', '生成失败');
      qrbox.innerHTML = '<div class="placeholder">生成失败<br>' + (e && e.message || e) + '</div>';
      showResult('生成失败：' + (e && e.message || e), false);
    }).finally(function(){ busy = false; });
  }

  function pollOnce(){
    if (!currentKey || busy) return;
    busy = true;
    get('/poll', { key: currentKey }).then(function(d){
      if (!d || !d.ok) return;
      if (d.code === 0) {
        stopTimer(); dot.classList.remove('pulse');
        setDot('ok', '登录成功');
        qrbox.innerHTML = '<div class="placeholder" style="color:#3ecf8e;font-size:15px">✓ 已登录</div>';
        showResult('登录成功：' + (d.detail || '凭证已保存'), true);
        refreshStatus();
      } else if (d.code === 86090) {
        setDot('warn', '已扫码，请在手机上确认');
      } else if (d.code === 86038) {
        stopTimer(); dot.classList.remove('pulse');
        setDot('err', '二维码已过期');
        showResult('二维码过期了，重新生成一个', false);
      }
    }).catch(function(){}).finally(function(){ busy = false; });
  }

  // ── 设置 ─────────────────────────────────────────────────
  var settingsBox = document.getElementById('settingsBox');
  var cfgResult = document.getElementById('cfgResult');
  var cfgData = null;

  function showCfgResult(t, ok){ cfgResult.textContent = t; cfgResult.className = 'result ' + (ok ? 'ok' : 'err'); }

  function loadConfig(){
    window.__cfgLoaded = true;
    settingsBox.innerHTML = '<div class="placeholder">加载中…</div>';
    ready().then(function(){ return get('/config'); }).then(function(d){
      if (!d || !d.ok) throw new Error((d && d.error) || '加载失败');
      cfgData = d.groups || [];
      renderConfig();
    }).catch(function(e){
      settingsBox.innerHTML = '<div class="placeholder">加载失败：' + (e && e.message || e) + '</div>';
    });
  }

  function renderConfig(){
    if (!cfgData || !cfgData.length) {
      settingsBox.innerHTML = '<div class="placeholder">没有可配置项</div>';
      return;
    }
    var html = '';
    cfgData.forEach(function(group){
      html += '<div class="group"><div class="group-title">' + group.title + '</div>';
      (group.fields || []).forEach(function(f){
        html += '<div class="field"><div class="label">'
          + '<div class="n">' + f.label + '</div>'
          + (f.hint ? '<div class="h">' + f.hint + '</div>' : '')
          + '</div><div class="ctrl">' + renderCtrl(f) + '</div></div>';
      });
      html += '</div>';
    });
    settingsBox.innerHTML = html;
    bindCtrl();
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderCtrl(f){
    var key = esc(f.key);
    if (f.type === 'bool') {
      return '<div class="switch"><input type="checkbox" data-key="' + key + '" data-type="bool"' + (f.value ? ' checked' : '') + '><span>' + (f.value ? '开' : '关') + '</span></div>';
    }
    if (f.type === 'int' || f.type === 'float') {
      return '<input type="number" data-key="' + key + '" data-type="' + f.type + '" value="' + esc(f.value) + '"' + (f.type === 'float' ? ' step="0.05" min="0" max="1"' : '') + '>';
    }
    if (f.type === 'list') {
      var text = Array.isArray(f.value) ? f.value.join('\n') : '';
      return '<textarea data-key="' + key + '" data-type="list" placeholder="一行一个">' + esc(text) + '</textarea>';
    }
    if (f.type === 'enum' && f.options) {
      var opts = f.options.map(function(o){
        return '<option value="' + esc(o) + '"' + (o === f.value ? ' selected' : '') + '>' + esc(o) + '</option>';
      }).join('');
      return '<select data-key="' + key + '" data-type="enum">' + opts + '</select>';
    }
    if (f.type === 'text') {
      return '<textarea data-key="' + key + '" data-type="string">' + esc(f.value) + '</textarea>';
    }
    return '<input type="text" data-key="' + key + '" data-type="string" value="' + esc(f.value) + '">';
  }

  function bindCtrl(){
    settingsBox.querySelectorAll('[data-key]').forEach(function(el){
      if (el.type === 'checkbox') {
        el.addEventListener('change', function(){
          el.parentNode.querySelector('span').textContent = el.checked ? '开' : '关';
        });
      }
    });
  }

  function collectConfig(){
    var out = {};
    settingsBox.querySelectorAll('[data-key]').forEach(function(el){
      var key = el.getAttribute('data-key');
      var type = el.getAttribute('data-type');
      if (type === 'bool') {
        out[key] = el.checked;
      } else if (type === 'int') {
        out[key] = parseInt(el.value, 10) || 0;
      } else if (type === 'float') {
        out[key] = parseFloat(el.value) || 0;
      } else if (type === 'list') {
        out[key] = el.value.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
      } else {
        out[key] = el.value;
      }
    });
    return out;
  }

  function saveConfig(){
    var payload = collectConfig();
    post('/config', { config: payload }).then(function(d){
      if (d && d.ok) showCfgResult('已保存 ' + (d.saved || 0) + ' 项', true);
      else showCfgResult('保存失败：' + ((d && d.error) || ''), false);
    }).catch(function(e){
      showCfgResult('保存失败：' + (e && e.message || e), false);
    });
  }

  // ── @ 用户 ───────────────────────────────────────────────
  var followList = document.getElementById('followList');
  var atCount = document.getElementById('atCount');
  var selected = [];

  function updateCount(){ atCount.textContent = '已选 ' + selected.length + ' 人'; }

  function loadFollowings(){
    followList.innerHTML = '<div class="placeholder">拉取中…（可能要几秒）</div>';
    ready().then(function(){ return get('/followings'); }).then(function(d){
      if (!d || !d.ok) throw new Error((d && d.error) || '拉取失败');
      var items = d.items || [];
      if (!items.length) {
        followList.innerHTML = '<div class="placeholder">没拉到关注列表，可能是 Cookie 失效或没有关注的人</div>';
        return;
      }
      var html = '';
      items.forEach(function(it){
        var checked = selected.indexOf(it.uname) >= 0 ? ' checked' : '';
        html += '<label class="item"><input type="checkbox" data-name="' + esc(it.uname) + '"' + checked + '>'
          + '<span>' + esc(it.uname) + '</span>'
          + (it.mutual ? '<span class="tag mutual">互关</span>' : '')
          + '</label>';
      });
      followList.innerHTML = html;
      followList.querySelectorAll('input[type=checkbox]').forEach(function(cb){
        cb.addEventListener('change', function(){
          var name = cb.getAttribute('data-name');
          if (cb.checked) { if (selected.indexOf(name) < 0) selected.push(name); }
          else { selected = selected.filter(function(x){ return x !== name; }); }
          updateCount();
        });
      });
    }).catch(function(e){
      followList.innerHTML = '<div class="placeholder">拉取失败：' + (e && e.message || e) + '</div>';
    });
  }

  function saveAt(){
    post('/at-users', { at_users: selected }).then(function(d){
      if (d && d.ok) showResult('已保存：' + (selected.length ? selected.join('、') : '（清空）'), true);
      else showResult('保存失败：' + ((d && d.error) || ''), false);
    }).catch(function(e){ showResult('保存失败：' + (e && e.message || e), false); });
  }

  document.getElementById('btnGen').addEventListener('click', genQr);
  document.getElementById('btnRefresh').addEventListener('click', refreshStatus);
  document.getElementById('btnFollow').addEventListener('click', loadFollowings);
  document.getElementById('btnSaveAt').addEventListener('click', saveAt);
  document.getElementById('btnReload').addEventListener('click', loadConfig);
  document.getElementById('btnSaveCfg').addEventListener('click', saveConfig);

  refreshStatus();
})();
</script>
</body>
</html>
