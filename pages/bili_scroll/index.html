<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刷B站</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --line:#272b34; --line2:#333a46;
    --text:#e6e8ee; --sub:#9aa3b2; --accent:#4f8cff;
    --ok:#3ecf8e; --warn:#f5a623; --err:#ff5c5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
  body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:18px}
  .wrap{max-width:960px;margin:0 auto}

  /* 登录条 */
  .authbar{
    display:none;align-items:center;gap:10px;background:#1a1f28;border:1px solid var(--line2);
    border-radius:12px;padding:12px 16px;margin-bottom:14px;
  }
  .authbar.show{display:flex}
  .authbar input{
    flex:1;min-width:120px;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);
    background:#14171d;color:var(--text);font:13px/1.5 inherit;
  }
  .authbar input:focus{outline:none;border-color:var(--accent)}
  .authbar .msg{font-size:12px;color:var(--err)}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--sub);font-size:13.5px;cursor:pointer;transition:.15s}
  .tab:hover{background:#181b22;color:var(--text)}
  .tab.active{background:#22262f;border-color:var(--line2);color:var(--text);font-weight:600}
  .panel{display:none}
  .panel.active{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:15px;font-weight:600}
  .card .desc{color:var(--sub);font-size:12.5px;margin-bottom:14px}
  .row{display:flex;gap:18px;flex-wrap:wrap}
  .col{flex:1;min-width:260px}
  .state{display:flex;align-items:center;gap:9px;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--sub);flex:none}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
  .dot.pulse{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  button{padding:9px 16px;border-radius:9px;border:1px solid var(--line2);background:#22262f;color:var(--text);font-size:13px;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){background:#2a2f3a}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:#3d7aec}
  button:disabled{opacity:.45;cursor:not-allowed}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .qrbox{display:flex;align-items:center;justify-content:center;width:250px;height:250px;background:#fff;border-radius:12px;padding:14px}
  .qrbox img{width:220px;height:220px;image-rendering:pixelated;display:block}
  .placeholder{color:#888;font-size:12.5px;text-align:center;padding:20px}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
  .meta div{background:#14171d;border:1px solid var(--line);border-radius:10px;padding:11px}
  .meta .k{color:var(--sub);font-size:11.5px;margin-bottom:3px}
  .meta .v{font-size:16px;font-weight:600}
  .list{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
  .item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
  .item:last-child{border-bottom:none}
  .item:hover{background:#14171d}
  .item input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  .tag{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--sub)}
  .tag.mutual{color:var(--ok);border-color:rgba(62,207,142,.4)}
  .tip{margin-top:12px;font-size:12px;color:var(--sub);line-height:1.7}
  .tip b{color:var(--warn)}
  .result{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:12.5px;display:none}
  .result.ok{display:block;background:rgba(62,207,142,.12);color:var(--ok);border:1px solid rgba(62,207,142,.3)}
  .result.err{display:block;background:rgba(255,92,92,.12);color:var(--err);border:1px solid rgba(255,92,92,.3)}
  .group{margin-bottom:22px}
  .group-title{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .field{display:flex;gap:14px;padding:9px 0;align-items:flex-start;border-bottom:1px solid rgba(39,43,52,.6)}
  .field:last-child{border-bottom:none}
  .field .label{flex:0 0 42%;min-width:0}
  .field .label .n{font-size:13px;margin-bottom:2px}
  .field .label .h{font-size:11.5px;color:var(--sub);line-height:1.5}
  .field .ctrl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);
    background:#14171d;color:var(--text);font:13px/1.5 inherit;
  }
  .field textarea{min-height:70px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
  .switch{display:flex;align-items:center;gap:8px}
  .switch input{width:38px;height:20px;appearance:none;background:#333a46;border-radius:10px;position:relative;cursor:pointer;transition:.2s;flex:none}
  .switch input:checked{background:var(--accent)}
  .switch input::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
  .switch input:checked::after{left:20px}
  .toast{
    position:fixed;top:22px;right:22px;z-index:99999;
    padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;
    background:rgba(62,207,142,.95);color:#0f1115;
    box-shadow:0 8px 28px rgba(0,0,0,.5);
    opacity:0;transform:translateY(-8px);pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.err{background:rgba(255,92,92,.95);color:#fff}
  .sticky-bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 4px;display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>
<div class="wrap">
  <div id="errbar" style="display:none;background:rgba(255,92,92,.12);border:1px solid rgba(255,92,92,.4);color:#ff5c5c;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;white-space:pre-wrap"></div>

  <div class="authbar" id="authbar">
    <span style="font-size:12.5px;color:var(--sub);white-space:nowrap">后台账号</span>
    <input id="auName" placeholder="用户名" value="astrbot" autocomplete="username">
    <input id="auPass" type="password" placeholder="密码" autocomplete="current-password">
    <button class="primary" id="btnAuth">连上</button>
    <span class="msg" id="authMsg"></span>
  </div>

  <div class="tabs">
    <button class="tab active" data-panel="login">登录</button>
    <button class="tab" data-panel="settings">设置</button>
    <button class="tab" data-panel="atusers">评论 @ 谁</button>
  </div>

  <div class="panel active" id="panel-login">
    <div class="card">
      <h2>B 站账号</h2>
      <div class="desc">没登录就没法搜索、读字幕、发评论</div>
      <div class="row">
        <div class="col">
          <div class="state"><span class="dot" id="dot"></span><span id="loginText">未连接</span></div>
          <div class="meta" id="metaBox" style="display:none">
            <div><div class="k">昵称</div><div class="v" id="mName">-</div></div>
            <div><div class="k">UID</div><div class="v" id="mUid">-</div></div>
            <div><div class="k">今日已挑</div><div class="v" id="mQuota">-</div></div>
          </div>
          <div class="actions">
            <button class="primary" id="btnGen">扫码登录</button>
            <button id="btnRefresh">刷新状态</button>
            <button id="btnRun">测跑一轮</button>
          </div>
          <div class="result" id="result"></div>
        </div>
        <div class="col" style="flex:none">
          <div class="qrbox" id="qrbox"><div class="placeholder">点「扫码登录」生成二维码</div></div>
        </div>
      </div>
      <div class="tip">手机 B 站扫码后，确认时选 <b>「记住我 / 长期」</b>。选 24 小时的话明天就得重扫。</div>
    </div>
  </div>

  <div class="panel" id="panel-settings">
    <div class="card">
      <h2>插件设置</h2>
      <div class="desc">改完点最下面的「保存设置」。改完立即生效，不用重启。</div>
      <div id="settingsBox"><div class="placeholder">切到这个标签页时加载</div></div>
      <div class="sticky-bar">
        <button id="btnReload">重新加载</button>
        <button class="primary" id="btnSaveCfg">保存设置</button>
      </div>
      <div class="result" id="cfgResult"></div>
    </div>
  </div>

  <div class="panel" id="panel-atusers">
    <div class="card">
      <h2>评论时 @ 谁</h2>
      <div class="desc">这里是你的全部关注，互关的排在最前面。勾了才会在评论末尾 @ 对方（按概率触发）</div>
      <div class="actions" style="margin-top:0;margin-bottom:8px">
        <button id="btnFollow">拉取关注列表</button>
        <button class="primary" id="btnSaveAt">保存选择</button>
        <span class="state" style="margin-left:auto"><span id="atCount">已选 0 人</span></span>
      </div>
      <div class="list" id="followList"><div class="placeholder">还没拉取。点上面的按钮。</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script type="module">
(function(){
  function showErr(msg){
    try {
      var el = document.getElementById('errbar');
      if (!el) return;
      el.style.display = 'block';
      el.textContent = String(msg).slice(0, 400);
    } catch(e) {}
  }
  window.addEventListener('error', function(e){
    showErr('JS 错误: ' + (e.message || e.error || ''));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    showErr('Promise 未捕获: ' + ((r && (r.message || r)) || ''));
  });

  var ROOT = '/api/plug/astrbot_plugin_bili_scroll';
  var TOKEN_KEY = 'bili_scroll_token';

  function getToken(){ try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e){ return ''; } }
  function setToken(t){ try { localStorage.setItem(TOKEN_KEY, t); } catch(e){} }

  function bridgeApi(){
    return window.AstrBotPluginView || window.AstrBotPluginPage || null;
  }

  // 给 promise 加超时；超时后走 fallback
  function withTimeout(promise, ms, fallback){
    var timer;
    var timeout = new Promise(function(_, reject){
      timer = setTimeout(function(){ reject(new Error('bridge 超时')); }, ms);
    });
    return Promise.race([promise, timeout]).then(
      function(v){ clearTimeout(timer); return v; },
      function(e){
        clearTimeout(timer);
        if (fallback) return fallback();
        throw e;
      }
    );
  }

  function bridgeRequest(method, path, body, params){
    var api = bridgeApi();
    if (!api || typeof api.apiGet !== 'function') {
      return Promise.reject(new Error('no bridge'));
    }
    // 关键1：父窗口会拼成 /api/v1/plugins/extensions/<pluginName>/<endpoint>
    //        所以只传 'status'，绝不能带插件名
    // 关键2：父窗口会拒绝带 ? # \ :// 的 endpoint ⇒ query 必须走 params
    var ep = String(path || '').split(/[?#]/)[0].replace(/^\/+/, '');
    var call = (method === 'GET')
      ? api.apiGet(ep, params || {})
      : api.apiPost(ep, body || {});
    return Promise.resolve(call).then(function(res){
      if (res && res.status === 'error' && /未授权/.test(res.message || '')) {
        throw new Error('未授权');
      }
      return res;
    });
  }

  function tokenRequest(method, path, body, params){
    var t = getToken();
    var opt = { method: method, headers: {} };
    if (t) opt.headers['Authorization'] = 'Bearer ' + t;
    var qs = '';
    if (params && typeof params === 'object') {
      var bits = [];
      Object.keys(params).forEach(function(k){
        if (params[k] !== undefined && params[k] !== null) {
          bits.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
        }
      });
      if (bits.length) qs = '?' + bits.join('&');
    }
    path = String(path || '').split(/[?#]/)[0] + qs;
    if (body !== undefined) {
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    }
    return fetch(ROOT + path, opt).then(function(r){
      if (r.status === 401) {
        setToken('');
        showAuthbar(true, '登录已过期，重新连一下');
        throw new Error('未授权');
      }
      return r.json();
    });
  }

  function request(method, path, body, params){
    // 先用 bridge（自带登录态，无需密码）；8 秒没响应再退回 token 方式
    return withTimeout(bridgeRequest(method, path, body, params), 8000, function(){
      return tokenRequest(method, path, body, params);
    });
  }
  function apiGet(path, params){ return request('GET', path, undefined, params); }
  function apiPost(path, body){ return request('POST', path, body); }

  var authbar = document.getElementById('authbar');
  var authMsg = document.getElementById('authMsg');

  function showAuthbar(show, msg){
    authbar.className = 'authbar' + (show ? ' show' : '');
    authMsg.textContent = msg || '';
  }

  function doAuth(){
    var u = document.getElementById('auName').value.trim();
    var p = document.getElementById('auPass').value;
    if (!u || !p) { authMsg.textContent = '账号密码都要填'; return; }
    authMsg.textContent = '连接中…';
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    }).then(function(r){ return r.json(); }).then(function(d){
      var tk = d && d.data && d.data.token;
      if (!tk) throw new Error((d && d.message) || '登录失败');
      setToken(tk);
      showAuthbar(false);
      boot2();
    }).catch(function(e){
      authMsg.textContent = '连接失败：' + (e && e.message || e);
    });
  }

  document.getElementById('btnAuth').addEventListener('click', doAuth);
  document.getElementById('auPass').addEventListener('keydown', function(e){
    if (e.key === 'Enter') doAuth();
  });

  // ── 主逻辑 ───────────────────────────────────────────────
  var dot, loginText, metaBox, qrbox, result, settingsBox, cfgResult, followList, atCount;
  var currentKey = '', timer = null, busy = false, selected = [], cfgData = null;

  function setDot(cls, text){
    if (!dot) return;
    dot.className = 'dot' + (cls ? ' ' + cls : '');
    loginText.textContent = text;
  }
  function showResult(t, ok){
    if (!result) return;
    result.textContent = t;
    result.className = 'result ' + (ok ? 'ok' : 'err');
  }
  function hideResult(){ if (result) { result.className = 'result'; result.textContent = ''; } }
  function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
  function toast(msg, ok){
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast show' + (ok ? '' : ' err');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function(){ el.className = 'toast'; }, 1200);
  }

  function updateCount(){
    if (!atCount) return;
    if (!selected.length) { atCount.textContent = '未选择'; return; }
    if (selected.length <= 4) {
      atCount.textContent = '已选 ' + selected.length + ' 人：' + selected.join('、');
    } else {
      atCount.textContent = '已选 ' + selected.length + ' 人：' + selected.slice(0, 4).join('、') + ' 等';
    }
  }

  function refreshStatus(){
    setDot('warn', '检查中…');
    apiGet('/status').then(function(d){
      if (!d || !d.ok) { setDot('err', '状态获取失败'); return; }
      if (d.logged_in) {
        setDot('ok', '已登录');
        metaBox.style.display = 'grid';
        document.getElementById('mName').textContent = d.name || '-';
        document.getElementById('mUid').textContent = d.uid || '-';
        document.getElementById('mQuota').textContent = (d.picked || 0) + '/' + (d.max_per_day || 0);
        if (Array.isArray(d.at_users)) { selected = d.at_users.slice(); updateCount(); }
      } else {
        setDot('err', '未登录');
        metaBox.style.display = 'none';
      }
    }).catch(function(e){ setDot('err', '请求失败'); });
  }

  function genQr(){
    if (busy) return;
    busy = true; hideResult(); stopTimer();
    setDot('warn', '生成二维码…');
    qrbox.innerHTML = '<div class="placeholder">生成中…</div>';
    apiGet('/qr').then(function(d){
      if (!d || !d.ok) throw new Error((d && d.error) || '生成失败');
      currentKey = d.key;
      qrbox.innerHTML = '<img alt="二维码" src="data:image/png;base64,' + d.image + '">';
      setDot('warn', '等待扫码');
      dot.classList.add('pulse');
      timer = setInterval(pollOnce, 2500);
    }).catch(function(e){
      setDot('err', '生成失败');
      qrbox.innerHTML = '<div class="placeholder">生成失败<br>' + (e && e.message || e) + '</div>';
      showResult('生成失败：' + (e && e.message || e), false);
    }).finally(function(){ busy = false; });
  }

  function pollOnce(){
    if (!currentKey || busy) return;
    busy = true;
    apiGet('poll', { key: currentKey }).then(function(d){
      if (!d || !d.ok) return;
      if (d.code === 0) {
        stopTimer(); dot.classList.remove('pulse');
        setDot('ok', '登录成功');
        qrbox.innerHTML = '<div class="placeholder" style="color:#3ecf8e;font-size:15px">✓ 已登录</div>';
        showResult('登录成功：' + (d.detail || '凭证已保存'), true);
        refreshStatus();
      } else if (d.code === 86090) {
        setDot('warn', '已扫码，请在手机上确认');
      } else if (d.code === 86038) {
        stopTimer(); dot.classList.remove('pulse');
        setDot('err', '二维码已过期');
        showResult('二维码过期了，重新生成一个', false);
      }
    }).catch(function(){}).finally(function(){ busy = false; });
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderCtrl(f){
    var key = esc(f.key);
    if (f.type === 'bool') {
      return '<div class="switch"><input type="checkbox" data-key="' + key + '" data-type="bool"' + (f.value ? ' checked' : '') + '><span>' + (f.value ? '开' : '关') + '</span></div>';
    }
    if (f.type === 'int' || f.type === 'float') {
      return '<input type="number" data-key="' + key + '" data-type="' + f.type + '" value="' + esc(f.value) + '"' + (f.type === 'float' ? ' step="0.05" min="0" max="1"' : '') + '>';
    }
    if (f.type === 'list') {
      var text = Array.isArray(f.value) ? f.value.join('\n') : '';
      return '<textarea data-key="' + key + '" data-type="list" placeholder="一行一个">' + esc(text) + '</textarea>';
    }
    if (f.type === 'enum' && f.options && f.options.length) {
      var opts = f.options.map(function(o){
        var label = (o === '' || o === null || o === undefined) ? '（不指定）' : o;
        return '<option value="' + esc(o) + '"' + (o === f.value ? ' selected' : '') + '>' + esc(label) + '</option>';
      }).join('');
      return '<select data-key="' + key + '" data-type="enum">' + opts + '</select>';
    }
    if (f.type === 'text') {
      return '<textarea data-key="' + key + '" data-type="string">' + esc(f.value) + '</textarea>';
    }
    return '<input type="text" data-key="' + key + '" data-type="string" value="' + esc(f.value) + '">';
  }

  function renderConfig(){
    if (!cfgData || !cfgData.length) {
      settingsBox.innerHTML = '<div class="placeholder">没有可配置项</div>';
      return;
    }
    var html = '';
    cfgData.forEach(function(group){
      html += '<div class="group"><div class="group-title">' + group.title + '</div>';
      (group.fields || []).forEach(function(f){
        html += '<div class="field"><div class="label">'
          + '<div class="n">' + f.label + '</div>'
          + (f.hint ? '<div class="h">' + f.hint + '</div>' : '')
          + '</div><div class="ctrl">' + renderCtrl(f) + '</div></div>';
      });
      html += '</div>';
    });
    settingsBox.innerHTML = html;
    settingsBox.querySelectorAll('input[type=checkbox]').forEach(function(el){
      el.addEventListener('change', function(){
        var span = el.parentNode.querySelector('span');
        if (span) span.textContent = el.checked ? '开' : '关';
      });
    });
  }

  function loadConfig(){
    window.__cfgLoaded = true;
    settingsBox.innerHTML = '<div class="placeholder">加载中…</div>';
    apiGet('/config').then(function(d){
      if (!d || !d.ok) throw new Error((d && d.error) || '加载失败');
      cfgData = d.groups || [];
      renderConfig();
    }).catch(function(e){
      settingsBox.innerHTML = '<div class="placeholder">加载失败：' + (e && e.message || e) + '</div>';
    });
  }

  function collectConfig(){
    var out = {};
    settingsBox.querySelectorAll('[data-key]').forEach(function(el){
      var key = el.getAttribute('data-key');
      var type = el.getAttribute('data-type');
      if (type === 'bool') out[key] = el.checked;
      else if (type === 'int') out[key] = parseInt(el.value, 10) || 0;
      else if (type === 'float') out[key] = parseFloat(el.value) || 0;
      else if (type === 'list') out[key] = el.value.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
      else out[key] = el.value;
    });
    return out;
  }

  function saveConfig(){
    apiPost('/config', { config: collectConfig() }).then(function(d){
      if (d && d.ok) { cfgResult.textContent = '已保存 ' + (d.saved || 0) + ' 项'; cfgResult.className = 'result ok'; }
      else { cfgResult.textContent = '保存失败：' + ((d && d.error) || ''); cfgResult.className = 'result err'; }
    }).catch(function(e){
      cfgResult.textContent = '保存失败：' + (e && e.message || e);
      cfgResult.className = 'result err';
    });
  }

  function loadFollowings(){
    try {
      if (!followList) {
        showResult('内部错误：列表容器没找到', false);
        return;
      }
      followList.innerHTML = '<div class="placeholder">拉取中…（可能要几秒）</div>';
    } catch(e) {
      return;
    }
    apiGet('/followings').then(function(d){
      if (!d || !d.ok) throw new Error((d && d.error) || '拉取失败');
      var items = d.items || [];
      if (!items.length) {
        followList.innerHTML = '<div class="placeholder">没拉到关注列表，可能是 Cookie 失效或没有关注的人</div>';
        return;
      }
      var html = '';
      items.forEach(function(it){
        var checked = selected.indexOf(it.uname) >= 0 ? ' checked' : '';
        html += '<label class="item"><input type="checkbox" data-name="' + esc(it.uname) + '"' + checked + '>'
          + '<span>' + esc(it.uname) + '</span>'
          + (it.mutual ? '<span class="tag mutual">互关</span>' : '')
          + '</label>';
      });
      followList.innerHTML = html;
      // 已选但不在关注列表里的（历史残留）单独提示
      var names = items.map(function(x){ return x.uname; });
      var orphan = selected.filter(function(x){ return names.indexOf(x) < 0; });
      if (orphan.length) {
        showResult('注意：这些已选名字不在关注列表里，可能是残留 —— ' + orphan.join('、') + '（可取消勾选后保存清掉）', false);
      }
      followList.querySelectorAll('input[type=checkbox]').forEach(function(cb){
        cb.addEventListener('change', function(){
          var name = cb.getAttribute('data-name');
          if (cb.checked) { if (selected.indexOf(name) < 0) selected.push(name); }
          else { selected = selected.filter(function(x){ return x !== name; }); }
          updateCount();
        });
      });
    }).catch(function(e){
      followList.innerHTML = '<div class="placeholder">拉取失败：' + (e && e.message || e) + '</div>';
    });
  }

  function saveAt(){
    apiPost('/at-users', { at_users: selected }).then(function(d){
      if (d && d.ok) {
        if (Array.isArray(d.at_users)) { selected = d.at_users.slice(); updateCount(); }
        var who = selected.length ? selected.join('、') : '（清空）';
        toast('已保存：' + who, true);
        showResult('已写进插件配置：' + who, true);
      } else {
        toast('保存失败', false);
        showResult('保存失败：' + ((d && d.error) || ''), false);
      }
    }).catch(function(e){
      toast('保存失败', false);
      showResult('保存失败：' + (e && e.message || e), false);
    });
  }

  function boot2(){
    dot = document.getElementById('dot');
    loginText = document.getElementById('loginText');
    metaBox = document.getElementById('metaBox');
    qrbox = document.getElementById('qrbox');
    result = document.getElementById('result');
    settingsBox = document.getElementById('settingsBox');
    cfgResult = document.getElementById('cfgResult');
    followList = document.getElementById('followList');
    atCount = document.getElementById('atCount');

    if (!dot.__bound) {
      document.getElementById('btnGen').addEventListener('click', genQr);
    document.getElementById('btnRun').addEventListener('click', runOnce);
      document.getElementById('btnRefresh').addEventListener('click', refreshStatus);
      document.getElementById('btnFollow').addEventListener('click', loadFollowings);
      document.getElementById('btnSaveAt').addEventListener('click', saveAt);
      document.getElementById('btnReload').addEventListener('click', loadConfig);
      document.getElementById('btnSaveCfg').addEventListener('click', saveConfig);
      dot.__bound = true;
    }

    refreshStatus();
  }

  // Tab 切换
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.getAttribute('data-panel')).classList.add('active');
      if (btn.getAttribute('data-panel') === 'settings' && !window.__cfgLoaded) loadConfig();
    });
  });

  // 启动：有 token 就直跑；没有就用配置里的后台账号免密换一个
  function autoAuth(){
    // bridge 可用就不需要任何登录
    var api = bridgeApi();
    if (api && typeof api.apiGet === 'function') {
      Promise.resolve(api.ready ? api.ready() : null)
        .catch(function(){})
        .then(function(){ boot2(); });
      return;
    }
    // 没 bridge 但有 token
    if (getToken()) { boot2(); return; }
    var d0 = document.getElementById('dot');
    var t0 = document.getElementById('loginText');
    if (d0) d0.className = 'dot warn pulse';
    if (t0) t0.textContent = '连接后台…';

    fetch(ROOT + '/bootstrap', { method: 'POST' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.ok && d.token) {
          setToken(d.token);
          boot2();
          return;
        }
        showAuthbar(true, (d && d.error) || '');
        if (d0) d0.className = 'dot err';
        if (t0) t0.textContent = '未连接后台';
      })
      .catch(function(){
        showAuthbar(true, '');
        if (d0) d0.className = 'dot err';
        if (t0) t0.textContent = '未连接后台';
      });
  }
  autoAuth();
})();
</script>
</body>
